name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cab_user
          POSTGRES_PASSWORD: cab_password
          POSTGRES_DB: cancer_aware_bharat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cab_user -d cancer_aware_bharat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cab_user:cab_password@localhost:5432/cancer_aware_bharat
      JWT_SECRET_KEY: ci-test-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run migrations
        run: alembic upgrade head
      - name: Exercise migration downgrade (then re-upgrade)
        # downgrade() had never actually been run anywhere before this --
        # an upgrade()-only migration can hide a downgrade() that's stale,
        # wrong, or references a since-renamed column/table and would only
        # be discovered during a real incident rollback. Round-trips back to
        # base and up to head again so every later step still sees the full
        # current schema.
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Migration drift check (models vs. migrations)
        # Blocking. 0023_reconcile_migration_drift resolved the
        # pre-existing drift between 0001's hand-written DDL and the
        # models (nullable/server_default representation and
        # unique-constraint-vs-unique-index differences) -- this now
        # means something and fails the build if a later migration ever
        # forgets to match its model change.
        run: alembic check
      - name: Seed dev data (tests log in as these accounts)
        run: python -m app.seed
      - name: Run tests
        run: pytest -v
      - name: Dependency vulnerability audit
        # Blocking, with two explicit, narrow exceptions:
        #  - PYSEC-2026-1325 (ecdsa): a timing side-channel on ECDSA
        #    signing/ECDH. The maintainer has no planned fix (side-channel
        #    attacks are declared out of scope for the project). Not
        #    reachable here regardless -- this app signs JWTs with HS256
        #    (see JWT_ALGORITHM in app/core/config.py), never ES*, so this
        #    library's ECDSA code path is never exercised.
        #  - PYSEC-2026-3447 (setuptools): fixed in 83.0.0, but setuptools
        #    is deliberately pinned <81 because razorpay's SDK still
        #    imports the now-removed pkg_resources (see requirements.txt).
        #    The CVE itself is a macOS-only sdist-building issue (Unicode
        #    filename normalization), irrelevant to how this app is built
        #    or run. Revisit once razorpay drops the pkg_resources import.
        # Any other finding still fails the build.
        run: >
          pip-audit -r requirements.txt
          --ignore-vuln PYSEC-2026-1325
          --ignore-vuln PYSEC-2026-3447
