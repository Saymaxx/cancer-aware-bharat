name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Dependency vulnerability audit
        # Non-blocking for now: fixing the two existing high/critical
        # findings (react-router-dom, vitest's esbuild/vite chain) needs
        # breaking major-version upgrades, out of scope for this phase.
        # Dependabot (.github/dependabot.yml) will open PRs for these;
        # this step keeps them visible in every CI run in the meantime.
        run: npm audit --audit-level=high
        continue-on-error: true

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cab_user
          POSTGRES_PASSWORD: cab_password
          POSTGRES_DB: cancer_aware_bharat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cab_user -d cancer_aware_bharat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cab_user:cab_password@localhost:5432/cancer_aware_bharat
      JWT_SECRET_KEY: ci-test-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run migrations
        run: alembic upgrade head
      - name: Exercise migration downgrade (then re-upgrade)
        # downgrade() had never actually been run anywhere before this --
        # an upgrade()-only migration can hide a downgrade() that's stale,
        # wrong, or references a since-renamed column/table and would only
        # be discovered during a real incident rollback. Round-trips back to
        # base and up to head again so every later step still sees the full
        # current schema.
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Migration drift check (models vs. migrations)
        # Non-blocking: the hand-written 0001 migration has known
        # pre-existing drift from the models (nullable/server_default
        # representation and unique-constraint-vs-unique-index differences)
        # that predates this check and needs its own dedicated migration to
        # reconcile -- not something to silently rewrite as a side effect of
        # adding CI visibility. This step's job is to make sure drift never
        # goes unnoticed again going forward.
        run: alembic check
        continue-on-error: true
      - name: Seed dev data (tests log in as these accounts)
        run: python -m app.seed
      - name: Run tests
        run: pytest -v
      - name: Dependency vulnerability audit
        # Non-blocking: see the matching frontend step above for why.
        run: pip-audit -r requirements.txt
        continue-on-error: true
