name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cab_user
          POSTGRES_PASSWORD: cab_password
          POSTGRES_DB: cancer_aware_bharat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cab_user -d cancer_aware_bharat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cab_user:cab_password@localhost:5432/cancer_aware_bharat
      JWT_SECRET_KEY: ci-test-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run migrations
        run: alembic upgrade head
      - name: Seed dev data (tests log in as these accounts)
        run: python -m app.seed
      - name: Run tests
        run: pytest -v
